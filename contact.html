<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | Contact</title>
    <meta name="description" content="Get in touch — available for freelance and international work." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="page-inner">
    <div class="page page-enter">
      <header class="site-header site-header--inner">
        <a href="index.html" class="site-header__brand">
          <span class="site-header__brand-name"></span>
          <span class="site-header__brand-role"></span>
        </a>
        <div class="site-header__right">
          <nav class="site-nav" aria-label="Main menu">
            <span class="site-nav__label">[Menu]</span>
            <ul class="site-nav__list"></ul>
          </nav>
          <button class="menu-btn" type="button" aria-label="Open menu">
            [Menu]
          </button>
        </div>
      </header>

      <main class="page-content">
        <header class="page-header">
          <h1 class="page-header__title">contact</h1>
          <p class="page-header__subtitle">Say hello — I'd love to hear from you</p>
          <div class="page-header__border" aria-hidden="true"></div>
        </header>
        <div class="page-content__body">
          <p>
            I'm always open to discussing new projects, creative ideas, or
            opportunities to be part of your vision. Feel free to reach out
            — I'd love to hear from you.
          </p>
        </div>
        <div class="contact-links">
          <a href="#" class="contact-link" data-config="email"></a>
          <a
            href="https://instagram.com"
            class="contact-link"
            target="_blank"
            rel="noopener"
            >Instagram</a
          >
          <a
            href="https://linkedin.com"
            class="contact-link"
            target="_blank"
            rel="noopener"
            >LinkedIn</a
          >
        </div>
      </main>

      <nav class="page-nav" aria-label="Page navigation">
        <a href="index.html" class="page-nav__link page-nav__next">Next Page</a>
        <div class="page-nav__socials"></div>
      </nav>
    </div>

    <nav class="menu-overlay" aria-label="Main menu" aria-hidden="true">
      <button class="menu-overlay__close" type="button" aria-label="Close menu">
        [Close]
      </button>
      <ul class="menu-overlay__list"></ul>
    </nav>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
